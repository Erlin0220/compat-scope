<main><h1><img src="COMPATSCOPE_LOGO" alt="CompatScope" width="34" height="34" style="vertical-align:-5px;margin-right:10px">故障排除信息</h1><div class="header"><div class="intro"><p>本页列出当前浏览器对项目所用技术的支持情况。遇到兼容性问题时，可将此页信息发送给开发者。<a href="#cap-section">查看能力检测结果</a></p><button id="copy">复制内容到剪贴板</button><span id="manual"></span></div><aside class="action"><h3>兼容性诊断</h3><p id="verdict" aria-live="polite">正在检测…</p></aside></div>

<script>
(function(){
'use strict';
var data=/*PAYLOAD*/null;
var names=['未提供','未确认','已提供'], agents=['Chrome','Edge','Firefox','Safari','iOS Safari','Android Chrome','Android Firefox','Samsung Internet','Android WebView','iOS WebView'];
var counts=[0,0,0], results=[], selected=-1;
function el(id){return document.getElementById(id)}
function make(tag,text,cls){var x=document.createElement(tag);if(text!==null)x.textContent=text;if(cls)x.className=cls;return x}
function probe(p){
 try{
  if(p[0]==='path'){
    var obj=window,keys=p[1],i;
    for(i=0;i<keys.length-1;i++){obj=obj[keys[i]];if(obj==null)return 0}
    var last=keys[keys.length-1];return (p[2]?typeof obj[last]==='function':last in Object(obj))?2:0;
  }
  if(p[0]==='element')return p[2] in document.createElement(p[1])?2:0;
  if(p[0]==='css')return window.CSS && typeof CSS.supports==='function'?(CSS.supports(p[1],p[2])?2:0):1;
  if(p[0]==='selector'){try{document.querySelector(p[1]);return 2}catch(e){return e.name==='SyntaxError'?0:1}}
  if(p[0]==='syntax'){try{Function(p[1]);return 2}catch(e){return e.name==='SyntaxError'?0:1}}
  if(p[0]==='at'){
    var definitions={container:['CSSContainerRule','@container (min-width:1px) {}'],layer:['CSSLayerBlockRule','@layer compatcheck {}'],scope:['CSSScopeRule','@scope (.x) {}'],'starting-style':['CSSStartingStyleRule','@starting-style {}']};
    var spec=definitions[p[1]];if(!spec)return 1;
    var style=document.createElement('style');document.head.appendChild(style);
    try{if(!style.sheet)return 1;style.sheet.insertRule(spec[1],0);var rule=style.sheet.cssRules[0];return typeof window[spec[0]]==='function' && rule instanceof window[spec[0]]?2:1}
    catch(e){return e.name==='SyntaxError'?0:1}finally{style.parentNode.removeChild(style)}
  }
 }catch(e){return 1}
 return 1;
}
var ua=navigator.userAgent,patterns=[['Edge',/(?:EdgA|EdgiOS|Edg|Edge)\/([\d.]+)/],['Samsung Internet',/SamsungBrowser\/([\d.]+)/],['Opera',/OPR\/([\d.]+)/],['Firefox',/(?:Firefox|FxiOS)\/([\d.]+)/],['Android WebView',/; wv\).*Chrome\/([\d.]+)/],['Chrome',/(?:Chrome|CriOS)\/([\d.]+)/],['Safari',/Version\/([\d.]+).*Safari/],['Internet Explorer',/Trident\/.*rv:([\d.]+)/]],browser='浏览器型号未识别';
for(var i=0;i<patterns.length;i++){var m=patterns[i][1].exec(ua);if(m){browser=patterns[i][0]+' '+m[1];break}}
el('browser').textContent=m?patterns[i][0]:browser;el('version').textContent=m?m[1]:'未识别';el('project').textContent=data.name;el('ua').textContent=ua;el('bcd').textContent='MDN Browser Compat Data '+data.version;
for(i=0;i<data.rows.length;i++){var r=data.rows[i],state=probe(r.probe);counts[state]++;results.push({r:r,s:state})}
results.sort(function(a,b){return a.s-b.s || a.r.label.localeCompare(b.r.label)});
var verdict=!results.length?'未识别到规则覆盖的能力':counts[0]?'当前环境缺少 '+counts[0]+' 项能力':counts[1]?'未发现明确缺失，仍有 '+counts[1]+' 项未确认':'当前环境提供了全部 '+counts[2]+' 项已识别能力';
el('verdict').textContent=verdict;
var summary='扫描 '+data.files+' 个文件 · 已提供 '+counts[2]+' 项 · 未提供 '+counts[0]+' 项 · 未确认 '+counts[1]+' 项';
el('counts').textContent=summary;el('foot').textContent='版本数据：MDN BCD '+data.version+'。仅检查本页环境，不加载项目代码。原型方法按名称匹配，同名业务方法也可能命中。';
var lines=[data.name,browser,ua,verdict,summary,'MDN BCD '+data.version,''];
function draw(){
 var box=el('list');box.textContent='';
 for(var j=0;j<results.length;j++){var item=results[j],row=item.r;if(selected!==-1&&item.s!==selected)continue;
 var tr=make('tr',null),loc=make('td',null);tr.appendChild(make('td',row.label));tr.appendChild(make('td',names[item.s],'s'+item.s));tr.appendChild(make('td',row.category));for(var k=0;k<row.locations.length;k++)loc.appendChild(make('div',row.locations[k]));tr.appendChild(loc);box.appendChild(tr);
 }
 if(!box.firstChild){var empty=make('tr',null),td=make('td','此分类没有记录。','empty');td.colSpan=4;empty.appendChild(td);box.appendChild(empty)}
}
function option(value,title){var o=make('option',title);o.value=String(value);el('filter').appendChild(o)}
option(-1,'全部 '+results.length);for(i=0;i<3;i++)option(i,names[i]+' '+counts[i]);
el('filter').onchange=function(){selected=Number(this.value);draw()};draw();
for(i=0;i<results.length;i++){var item=results[i],row=item.r;lines.push('['+names[item.s]+'] '+row.label+' · '+row.category,agents.map(function(a,k){return a+' '+row.support[k]}).join(' / '),row.locations.join('\n'),'')}
var diagnostic=lines.join('\n');
for(i=0;i<agents.length;i++)el('matrixhead').appendChild(make('th',agents[i]));
for(i=0;i<results.length;i++){var rr=results[i].r,tr=make('tr',null);tr.appendChild(make('td',rr.label));for(var k=0;k<agents.length;k++)tr.appendChild(make('td',rr.support[k]));el('matrix').appendChild(tr)}
function legacyCopy(){
 var box=el('manual');box.textContent='';
 var t=make('textarea',null);t.value=diagnostic;t.setAttribute('aria-label','手动复制诊断内容');t.style.cssText='position:fixed;left:-10000px;top:0';box.appendChild(t);t.select();
 var copied=false;try{copied=document.execCommand('copy')}catch(e){/* Retain selection for manual copy. */}
 if(copied){box.removeChild(t);el('copy').focus();return}
 t.style.cssText='';t.focus();t.select();
}
el('copy').onclick=function(){el('manual').textContent='';if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(diagnostic).catch(legacyCopy);return}legacyCopy()};
}());
</script></html>
